<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kasir Warung Kopi</title>
<style>
  :root{
    --coffee-dark:#4b2e1e;
    --coffee:#6f4518;
    --coffee-light:#a9744f;
    --cream:#fff8f0;
    --cream-2:#f5e6d3;
    --accent:#7c9473;
    --accent-dark:#5e7857;
    --danger:#c0504d;
    --text-dark:#3a2a1d;
    --radius:14px;
    --shadow:0 4px 14px rgba(75,46,30,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:var(--cream);
    color:var(--text-dark);
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;cursor:pointer;border:none;}
  input,select{font-family:inherit;}

  /* ---------- Header & Tabs ---------- */
  header{
    background:linear-gradient(135deg,var(--coffee-dark),var(--coffee));
    color:#fff;
    padding:14px 16px 0 16px;
    position:sticky;
    top:0;
    z-index:50;
    box-shadow:var(--shadow);
  }
  header h1{
    margin:0 0 10px 0;
    font-size:1.25rem;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tabs{
    display:flex;
    gap:4px;
    overflow-x:auto;
  }
  .tab-btn{
    background:rgba(255,255,255,0.12);
    color:#fff;
    padding:10px 16px;
    border-radius:10px 10px 0 0;
    font-weight:600;
    font-size:0.92rem;
    white-space:nowrap;
    opacity:0.75;
  }
  .tab-btn.active{
    background:var(--cream);
    color:var(--coffee-dark);
    opacity:1;
  }

  main{
    max-width:1200px;
    margin:0 auto;
    padding:14px;
    padding-bottom:60px;
  }
  .tab{display:none;}
  .tab.active{display:block;}

  /* ---------- POS Layout ---------- */
  .pos-layout{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  @media(min-width:900px){
    .pos-layout{
      flex-direction:row;
      align-items:flex-start;
    }
    .menu-panel{flex:1 1 60%;}
    .cart-panel{
      flex:0 0 360px;
      position:sticky;
      top:100px;
    }
  }

  .category-block{margin-bottom:20px;}
  .category-title{
    font-size:1.05rem;
    font-weight:700;
    color:var(--coffee-dark);
    margin:0 0 10px 2px;
    border-left:5px solid var(--accent);
    padding-left:8px;
  }
  .menu-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:12px;
  }
  .menu-card{
    background:#fff;
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    transition:transform .12s;
  }
  .menu-card:active{transform:scale(0.97);}
  .menu-card img{
    width:100%;
    height:100px;
    object-fit:cover;
    display:block;
    background:var(--cream-2);
  }
  .menu-card .info{
    padding:8px 10px 10px 10px;
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
  }
  .menu-card .name{
    font-weight:700;
    font-size:0.88rem;
    text-align:center;
    color:var(--text-dark);
    min-height:34px;
  }
  .menu-card .price{
    text-align:center;
    color:var(--coffee);
    font-weight:700;
    font-size:0.85rem;
  }
  .menu-card select.variant-select{
    width:100%;
    padding:5px;
    border-radius:8px;
    border:1px solid var(--cream-2);
    font-size:0.78rem;
    background:var(--cream);
  }
  .menu-card .add-btn{
    background:var(--accent);
    color:#fff;
    padding:8px;
    border-radius:8px;
    font-weight:700;
    font-size:0.85rem;
    width:100%;
  }
  .menu-card .add-btn:active{background:var(--accent-dark);}

  /* ---------- Cart ---------- */
  .cart-panel{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:14px;
  }
  .cart-panel h2{
    margin:0 0 10px 0;
    font-size:1.05rem;
    color:var(--coffee-dark);
  }
  .cart-items{
    max-height:320px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:10px;
  }
  .cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    background:var(--cream);
    border-radius:10px;
    padding:8px 10px;
  }
  .cart-item .ci-name{
    font-size:0.85rem;
    font-weight:600;
    flex:1;
  }
  .cart-item .ci-variant{
    font-size:0.72rem;
    color:var(--coffee-light);
    display:block;
  }
  .qty-ctrl{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .qty-ctrl button{
    width:26px;height:26px;
    border-radius:50%;
    background:var(--coffee);
    color:#fff;
    font-weight:700;
    font-size:1rem;
    line-height:1;
  }
  .qty-ctrl span{min-width:18px;text-align:center;font-weight:700;}
  .ci-remove{
    background:var(--danger);
    color:#fff;
    width:24px;height:24px;
    border-radius:50%;
    font-size:0.8rem;
  }
  .cart-empty{
    text-align:center;
    color:#a08a78;
    padding:20px 0;
    font-size:0.88rem;
  }
  .cart-summary{
    border-top:2px dashed var(--cream-2);
    padding-top:10px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .summary-row{
    display:flex;
    justify-content:space-between;
    font-size:0.92rem;
  }
  .summary-row.total{
    font-size:1.15rem;
    font-weight:800;
    color:var(--coffee-dark);
  }
  .cart-summary input[type=number]{
    padding:9px;
    border-radius:8px;
    border:1px solid var(--cream-2);
    font-size:0.95rem;
    width:100%;
    text-align:right;
  }
  .btn{
    padding:11px;
    border-radius:10px;
    font-weight:700;
    font-size:0.9rem;
    width:100%;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:disabled{background:#c9d2c4;cursor:not-allowed;}
  .btn-secondary{background:var(--coffee-light);color:#fff;}
  .btn-outline{background:#fff;border:2px solid var(--coffee-light) !important;color:var(--coffee-dark);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-row{display:flex;gap:8px;margin-top:8px;}
  .btn-row .btn{flex:1;}

  /* ---------- Rekap ---------- */
  .omzet-card{
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#fff;
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
    box-shadow:var(--shadow);
  }
  .omzet-card .label{font-size:0.85rem;opacity:0.9;}
  .omzet-card .value{font-size:1.8rem;font-weight:800;margin-top:4px;}
  .riwayat-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .riwayat-header h3{margin:0;color:var(--coffee-dark);}
  .trx-card{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:12px 14px;
    margin-bottom:10px;
  }
  .trx-card .trx-top{
    display:flex;
    justify-content:space-between;
    font-weight:700;
    color:var(--coffee-dark);
    margin-bottom:6px;
    font-size:0.9rem;
  }
  .trx-card ul{
    margin:0 0 6px 0;
    padding-left:18px;
    font-size:0.83rem;
    color:#5c493c;
  }
  .trx-card .trx-total{
    text-align:right;
    font-weight:800;
    color:var(--coffee);
  }
  .empty-state{
    text-align:center;
    color:#a08a78;
    padding:30px 10px;
  }

  /* ---------- Menu Management ---------- */
  .menu-form{
    background:#fff;
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px;
    margin-bottom:18px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .menu-form h3{grid-column:1/-1;margin:0 0 6px 0;color:var(--coffee-dark);}
  .menu-form label{
    font-size:0.8rem;
    font-weight:600;
    color:var(--coffee-dark);
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .menu-form input,.menu-form select{
    padding:9px;
    border-radius:8px;
    border:1px solid var(--cream-2);
    font-size:0.9rem;
  }
  .menu-form .full{grid-column:1/-1;}
  @media(max-width:520px){
    .menu-form{grid-template-columns:1fr;}
  }
  .menu-list-table{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .menu-list-item{
    background:#fff;
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:8px 10px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .menu-list-item img{
    width:48px;height:48px;
    object-fit:cover;
    border-radius:8px;
    flex-shrink:0;
    background:var(--cream-2);
  }
  .menu-list-item .mli-info{flex:1;min-width:0;}
  .menu-list-item .mli-name{font-weight:700;font-size:0.9rem;}
  .menu-list-item .mli-meta{font-size:0.76rem;color:#8a7563;}
  .mli-actions{display:flex;gap:6px;}
  .mli-actions button{
    padding:6px 10px;
    border-radius:8px;
    font-size:0.75rem;
    font-weight:700;
  }
  .icon-btn-edit{background:var(--coffee-light);color:#fff;}
  .icon-btn-del{background:var(--danger);color:#fff;}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--coffee-dark);
    color:#fff;
    padding:10px 18px;
    border-radius:30px;
    font-size:0.85rem;
    box-shadow:var(--shadow);
    opacity:0;
    pointer-events:none;
    transition:all .25s;
    z-index:200;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- Print struk ---------- */
  #print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{
      display:block !important;
      position:absolute;
      top:0;left:0;
      width:280px;
      padding:10px;
      font-family:'Courier New',monospace;
      font-size:12px;
    }
    #print-area h2{text-align:center;margin:0 0 4px 0;font-size:14px;}
    #print-area .line{border-top:1px dashed #000;margin:6px 0;}
    #print-area table{width:100%;border-collapse:collapse;font-size:11px;}
    #print-area td{padding:2px 0;}
  }

  /* struk modal (preview di layar) */
  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.5);
    display:none;
    align-items:center;justify-content:center;
    z-index:300;
    padding:16px;
  }
  .modal-overlay.show{display:flex;}
  .modal-box{
    background:#fff;
    border-radius:var(--radius);
    padding:18px;
    max-width:320px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    font-family:'Courier New',monospace;
    font-size:0.8rem;
  }
  .modal-box h2{text-align:center;color:var(--coffee-dark);font-family:'Segoe UI',sans-serif;}
  .modal-box .line{border-top:1px dashed #999;margin:8px 0;}
  .modal-box table{width:100%;font-size:0.75rem;}
  .modal-box .modal-btns{display:flex;gap:8px;margin-top:14px;font-family:'Segoe UI',sans-serif;}
</style>
</head>
<body>

<header>
  <h1>☕ Kasir Warung Kopi</h1>
  <div class="tabs">
    <button class="tab-btn active" data-tab="kasir">Kasir</button>
    <button class="tab-btn" data-tab="rekap">Rekap Harian</button>
    <button class="tab-btn" data-tab="menu">Kelola Menu</button>
  </div>
</header>

<main>

  <!-- ================= TAB KASIR ================= -->
  <section id="tab-kasir" class="tab active">
    <div class="pos-layout">
      <div class="menu-panel" id="menuPanel"></div>

      <div class="cart-panel">
        <h2>🧾 Keranjang Pesanan</h2>
        <div class="cart-items" id="cartItems">
          <div class="cart-empty">Belum ada pesanan. Silakan pilih menu.</div>
        </div>
        <div class="cart-summary">
          <div class="summary-row total">
            <span>Total</span><span id="totalBelanja">Rp 0</span>
          </div>
          <label style="font-size:0.8rem;font-weight:600;color:var(--coffee-dark);">Uang Bayar</label>
          <input type="number" id="uangBayar" placeholder="Masukkan jumlah uang" min="0">
          <div class="summary-row">
            <span>Kembalian</span><span id="kembalian">Rp 0</span>
          </div>
          <button class="btn btn-primary" id="btnSimpan" disabled>💾 Simpan Transaksi</button>
          <div class="btn-row">
            <button class="btn btn-outline" id="btnKosongkan">🗑️ Kosongkan</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= TAB REKAP ================= -->
  <section id="tab-rekap" class="tab">
    <div class="omzet-card">
      <div class="label">Total Pemasukan Hari Ini</div>
      <div class="value" id="omzetHarian">Rp 0</div>
    </div>
    <div class="riwayat-header">
      <h3>Riwayat Transaksi</h3>
      <button class="btn btn-danger" style="width:auto;padding:8px 14px;font-size:0.8rem;" id="btnResetRiwayat">Hapus Semua</button>
    </div>
    <div id="riwayatList"></div>
  </section>

  <!-- ================= TAB MENU ================= -->
  <section id="tab-menu" class="tab">
    <form class="menu-form" id="formMenu">
      <h3 id="formMenuTitle">➕ Tambah Menu Baru</h3>
      <input type="hidden" id="menuId">
      <label class="full">Nama Menu
        <input type="text" id="menuNama" required placeholder="Contoh: Kopi Susu Gula Aren">
      </label>
      <label>Harga (Rp)
        <input type="number" id="menuHarga" required min="0" placeholder="5000">
      </label>
      <label>Kategori
        <select id="menuKategori">
          <option value="Minuman">Minuman</option>
          <option value="Makanan">Makanan</option>
        </select>
      </label>
      <label class="full">URL Gambar (opsional — kosongkan untuk pakai gambar bawaan)
        <input type="text" id="menuGambar" placeholder="https://...">
      </label>
      <div class="full btn-row">
        <button type="submit" class="btn btn-primary" id="btnSubmitMenu">Simpan Menu</button>
        <button type="button" class="btn btn-outline" id="btnBatalEdit" style="display:none;">Batal</button>
      </div>
    </form>

    <div class="menu-list-table" id="menuListTable"></div>
  </section>

</main>

<!-- Struk Modal -->
<div class="modal-overlay" id="modalStruk">
  <div class="modal-box">
    <div id="strukContent"></div>
    <div class="modal-btns">
      <button class="btn btn-secondary" id="btnCetakStruk">🖨️ Cetak</button>
      <button class="btn btn-primary" id="btnWaStruk">📲 Kirim WA</button>
    </div>
    <div class="modal-btns">
      <button class="btn btn-outline" id="btnTutupStruk">Tutup</button>
    </div>
  </div>
</div>

<!-- Area khusus untuk print fisik -->
<div id="print-area"></div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  /* ================= UTIL ================= */
  const rupiah = n => "Rp " + Math.round(n).toLocaleString("id-ID");
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove("show"), 2200);
  }

  function placeholderImg(name){
    const initial = (name||"?").trim().charAt(0).toUpperCase();
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300">
      <rect width="100%" height="100%" fill="#f5e6d3"/>
      <text x="50%" y="50%" font-size="80" font-family="sans-serif" fill="#a9744f"
        text-anchor="middle" dominant-baseline="middle">${initial}</text>
    </svg>`;
    return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
  }

  /* ================= DEFAULT MENU ================= */
  const DEFAULT_MENU = [
    {name:"Kopi Hitam", price:4000, category:"Minuman", image:"https://source.unsplash.com/400x300/?black-coffee"},
    {name:"Good Day Original", price:5000, category:"Minuman", image:"https://source.unsplash.com/400x300/?instant-coffee"},
    {name:"Good Day Mocacino", price:5000, category:"Minuman", image:"https://source.unsplash.com/400x300/?mocha-coffee"},
    {name:"Good Day Cappuccino", price:5000, category:"Minuman", image:"https://source.unsplash.com/400x300/?cappuccino"},
    {name:"Kopi Jahe", price:5000, category:"Minuman", image:"https://source.unsplash.com/400x300/?ginger-tea"},
    {name:"Drink Beng-Beng", price:5000, category:"Minuman", image:"https://source.unsplash.com/400x300/?chocolate-drink"},
    {name:"Nutrisari", price:4000, category:"Minuman", image:"https://source.unsplash.com/400x300/?orange-juice"},
    {name:"STMJ", price:8000, category:"Minuman", image:"https://source.unsplash.com/400x300/?ginger-milk-drink"},
    {name:"Extra Joss", price:4000, category:"Minuman", image:"https://source.unsplash.com/400x300/?energy-drink"},
    {name:"Energen", price:5000, category:"Minuman", image:"https://source.unsplash.com/400x300/?cereal-drink"},
    {name:"Pop Mie", price:7000, category:"Makanan", image:"https://source.unsplash.com/400x300/?cup-noodles"},
    {name:"Mie Instan", price:6000, category:"Makanan", image:"https://source.unsplash.com/400x300/?instant-noodles"},
    {name:"Nasi Telur", price:10000, category:"Makanan", image:"https://source.unsplash.com/400x300/?fried-egg-rice"}
  ].map(m => ({id:uid(), ...m}));

  /* ================= STORAGE ================= */
  const LS_MENU = "kasir_menu_v1";
  const LS_TRX  = "kasir_transaksi_v1";
  const LS_CART = "kasir_cart_v1";

  function loadMenu(){
    const raw = localStorage.getItem(LS_MENU);
    if(!raw){
      localStorage.setItem(LS_MENU, JSON.stringify(DEFAULT_MENU));
      return JSON.parse(JSON.stringify(DEFAULT_MENU));
    }
    try{ return JSON.parse(raw); }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_MENU)); }
  }
  function saveMenu(){ localStorage.setItem(LS_MENU, JSON.stringify(menu)); }

  function loadTrx(){
    try{ return JSON.parse(localStorage.getItem(LS_TRX)) || []; }catch(e){ return []; }
  }
  function saveTrx(){ localStorage.setItem(LS_TRX, JSON.stringify(transaksi)); }

  function loadCart(){
    try{ return JSON.parse(localStorage.getItem(LS_CART)) || []; }catch(e){ return []; }
  }
  function saveCart(){ localStorage.setItem(LS_CART, JSON.stringify(cart)); }

  let menu = loadMenu();
  let transaksi = loadTrx();
  let cart = loadCart();

  /* ================= TABS ================= */
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".tab").forEach(s=>s.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-"+btn.dataset.tab).classList.add("active");
      if(btn.dataset.tab === "rekap") renderRekap();
      if(btn.dataset.tab === "menu") renderMenuList();
    });
  });

  /* ================= RENDER MENU (KASIR) ================= */
  function renderMenuPanel(){
    const panel = document.getElementById("menuPanel");
    const categories = ["Minuman","Makanan"];
    // include any custom category too
    menu.forEach(m=>{ if(!categories.includes(m.category)) categories.push(m.category); });

    panel.innerHTML = "";
    categories.forEach(cat=>{
      const items = menu.filter(m=>m.category === cat);
      if(items.length === 0) return;
      const block = document.createElement("div");
      block.className = "category-block";
      const icon = cat === "Minuman" ? "🥤" : (cat === "Makanan" ? "🍜" : "📦");
      block.innerHTML = `<div class="category-title">${icon} ${cat}</div>
        <div class="menu-grid" data-cat="${cat}"></div>`;
      panel.appendChild(block);
      const grid = block.querySelector(".menu-grid");
      items.forEach(item=>{
        const card = document.createElement("div");
        card.className = "menu-card";
        const isMinuman = cat === "Minuman";
        card.innerHTML = `
          <img src="${item.image || placeholderImg(item.name)}"
               alt="${item.name}"
               onerror="this.onerror=null;this.src='${placeholderImg(item.name)}'">
          <div class="info">
            <div class="name">${item.name}</div>
            <div class="price">${rupiah(item.price)}</div>
            ${isMinuman ? `<select class="variant-select">
                <option value="Panas">🔥 Panas</option>
                <option value="Dingin">🧊 Dingin</option>
              </select>` : ``}
            <button class="add-btn" data-id="${item.id}">+ Tambah</button>
          </div>`;
        grid.appendChild(card);
        card.querySelector(".add-btn").addEventListener("click", ()=>{
          const variant = isMinuman ? card.querySelector(".variant-select").value : null;
          addToCart(item, variant);
        });
      });
    });
  }

  /* ================= CART ================= */
  function addToCart(item, variant){
    const key = item.id + "|" + (variant||"");
    let existing = cart.find(c=>c.key === key);
    if(existing){
      existing.qty += 1;
    }else{
      cart.push({
        key, menuId:item.id, name:item.name, variant:variant,
        price:item.price, qty:1
      });
    }
    saveCart();
    renderCart();
    toast(`${item.name}${variant?" ("+variant+")":""} ditambahkan`);
  }

  function changeQty(key, delta){
    const c = cart.find(x=>x.key === key);
    if(!c) return;
    c.qty += delta;
    if(c.qty <= 0){ cart = cart.filter(x=>x.key !== key); }
    saveCart();
    renderCart();
  }

  function removeCartItem(key){
    cart = cart.filter(x=>x.key !== key);
    saveCart();
    renderCart();
  }

  function cartTotal(){
    return cart.reduce((s,c)=>s + c.price*c.qty, 0);
  }

  function renderCart(){
    const wrap = document.getElementById("cartItems");
    if(cart.length === 0){
      wrap.innerHTML = `<div class="cart-empty">Belum ada pesanan. Silakan pilih menu.</div>`;
    }else{
      wrap.innerHTML = "";
      cart.forEach(c=>{
        const row = document.createElement("div");
        row.className = "cart-item";
        row.innerHTML = `
          <div class="ci-name">${c.name}${c.variant ? `<span class="ci-variant">${c.variant==="Panas"?"🔥":"🧊"} ${c.variant}</span>`:""}</div>
          <div class="qty-ctrl">
            <button class="btn-minus">-</button>
            <span>${c.qty}</span>
            <button class="btn-plus">+</button>
          </div>
          <div style="font-size:0.82rem;font-weight:700;min-width:64px;text-align:right;">${rupiah(c.price*c.qty)}</div>
          <button class="ci-remove">✕</button>`;
        row.querySelector(".btn-plus").addEventListener("click", ()=>changeQty(c.key, 1));
        row.querySelector(".btn-minus").addEventListener("click", ()=>changeQty(c.key, -1));
        row.querySelector(".ci-remove").addEventListener("click", ()=>removeCartItem(c.key));
        wrap.appendChild(row);
      });
    }
    const total = cartTotal();
    document.getElementById("totalBelanja").textContent = rupiah(total);
    updateKembalian();
    document.getElementById("btnSimpan").disabled = cart.length === 0;
  }

  function updateKembalian(){
    const total = cartTotal();
    const bayar = parseFloat(document.getElementById("uangBayar").value) || 0;
    const kembali = bayar - total;
    const el = document.getElementById("kembalian");
    el.textContent = rupiah(Math.max(kembali,0) < 0 ? 0 : kembali);
    el.style.color = kembali < 0 ? "#c0504d" : "#3a2a1d";
  }

  document.getElementById("uangBayar").addEventListener("input", updateKembalian);

  document.getElementById("btnKosongkan").addEventListener("click", ()=>{
    if(cart.length===0) return;
    if(confirm("Kosongkan keranjang pesanan?")){
      cart = [];
      saveCart();
      renderCart();
      document.getElementById("uangBayar").value = "";
      updateKembalian();
    }
  });

  /* ================= SIMPAN TRANSAKSI ================= */
  let lastTrx = null;

  document.getElementById("btnSimpan").addEventListener("click", ()=>{
    if(cart.length === 0) return;
    const total = cartTotal();
    const bayar = parseFloat(document.getElementById("uangBayar").value) || 0;
    if(bayar < total){
      if(!confirm("Uang bayar kurang dari total belanja. Simpan transaksi tetap?")) return;
    }
    const trx = {
      id: uid(),
      datetime: new Date().toISOString(),
      items: cart.map(c=>({name:c.name, variant:c.variant, qty:c.qty, price:c.price, subtotal:c.price*c.qty})),
      total: total,
      bayar: bayar,
      kembalian: Math.max(bayar-total,0)
    };
    transaksi.unshift(trx);
    saveTrx();
    lastTrx = trx;

    cart = [];
    saveCart();
    renderCart();
    document.getElementById("uangBayar").value = "";
    updateKembalian();

    toast("Transaksi berhasil disimpan ✔️");
    showStruk(trx);
  });

  /* ================= STRUK ================= */
  function buildStrukHTML(trx){
    const tgl = new Date(trx.datetime);
    const tglStr = tgl.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});
    const jamStr = tgl.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
    let rows = trx.items.map(it=>`
        <tr><td colspan="2">${it.name}${it.variant?" ("+it.variant+")":""}</td></tr>
        <tr><td>${it.qty} x ${rupiah(it.price)}</td><td style="text-align:right;">${rupiah(it.subtotal)}</td></tr>
    `).join("");
    return `
      <h2>☕ Warung Kopi</h2>
      <div style="text-align:center;">${tglStr} · ${jamStr}</div>
      <div class="line"></div>
      <table>${rows}</table>
      <div class="line"></div>
      <table>
        <tr><td><b>Total</b></td><td style="text-align:right;"><b>${rupiah(trx.total)}</b></td></tr>
        <tr><td>Bayar</td><td style="text-align:right;">${rupiah(trx.bayar)}</td></tr>
        <tr><td>Kembali</td><td style="text-align:right;">${rupiah(trx.kembalian)}</td></tr>
      </table>
      <div class="line"></div>
      <div style="text-align:center;">Terima kasih 🙏</div>
    `;
  }

  function showStruk(trx){
    lastTrx = trx;
    document.getElementById("strukContent").innerHTML = buildStrukHTML(trx);
    document.getElementById("modalStruk").classList.add("show");
  }
  document.getElementById("btnTutupStruk").addEventListener("click", ()=>{
    document.getElementById("modalStruk").classList.remove("show");
  });
  document.getElementById("btnCetakStruk").addEventListener("click", ()=>{
    if(!lastTrx) return;
    document.getElementById("print-area").innerHTML = buildStrukHTML(lastTrx);
    window.print();
  });
  document.getElementById("btnWaStruk").addEventListener("click", ()=>{
    if(!lastTrx) return;
    const trx = lastTrx;
    const tgl = new Date(trx.datetime);
    let text = `*Struk Warung Kopi*\n${tgl.toLocaleDateString("id-ID")} ${tgl.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}\n\n`;
    trx.items.forEach(it=>{
      text += `${it.name}${it.variant?" ("+it.variant+")":""} x${it.qty} = ${rupiah(it.subtotal)}\n`;
    });
    text += `\nTotal: ${rupiah(trx.total)}\nBayar: ${rupiah(trx.bayar)}\nKembali: ${rupiah(trx.kembalian)}\n\nTerima kasih 🙏`;
    window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
  });

  /* ================= REKAP ================= */
  function renderRekap(){
    const today = new Date().toDateString();
    const todayTotal = transaksi
      .filter(t => new Date(t.datetime).toDateString() === today)
      .reduce((s,t)=>s+t.total,0);
    document.getElementById("omzetHarian").textContent = rupiah(todayTotal);

    const list = document.getElementById("riwayatList");
    if(transaksi.length === 0){
      list.innerHTML = `<div class="empty-state">Belum ada transaksi tercatat.</div>`;
      return;
    }
    list.innerHTML = "";
    transaksi.forEach(t=>{
      const d = new Date(t.datetime);
      const jamStr = d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});
      const tglStr = d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});
      const card = document.createElement("div");
      card.className = "trx-card";
      card.innerHTML = `
        <div class="trx-top"><span>${tglStr} · ${jamStr}</span><span>${rupiah(t.total)}</span></div>
        <ul>${t.items.map(it=>`<li>${it.name}${it.variant?" ("+it.variant+")":""} x${it.qty}</li>`).join("")}</ul>
        <div class="trx-total">Bayar ${rupiah(t.bayar)} · Kembali ${rupiah(t.kembalian)}</div>
      `;
      list.appendChild(card);
    });
  }

  document.getElementById("btnResetRiwayat").addEventListener("click", ()=>{
    if(transaksi.length===0) return;
    if(confirm("Hapus SEMUA riwayat transaksi? Tindakan ini tidak bisa dibatalkan.")){
      transaksi = [];
      saveTrx();
      renderRekap();
      toast("Riwayat transaksi dihapus");
    }
  });

  /* ================= MANAJEMEN MENU (CRUD) ================= */
  const formMenu = document.getElementById("formMenu");
  const btnBatalEdit = document.getElementById("btnBatalEdit");

  function renderMenuList(){
    const wrap = document.getElementById("menuListTable");
    wrap.innerHTML = "";
    if(menu.length === 0){
      wrap.innerHTML = `<div class="empty-state">Belum ada menu.</div>`;
      return;
    }
    menu.forEach(item=>{
      const row = document.createElement("div");
      row.className = "menu-list-item";
      row.innerHTML = `
        <img src="${item.image || placeholderImg(item.name)}" onerror="this.onerror=null;this.src='${placeholderImg(item.name)}'">
        <div class="mli-info">
          <div class="mli-name">${item.name}</div>
          <div class="mli-meta">${item.category} · ${rupiah(item.price)}</div>
        </div>
        <div class="mli-actions">
          <button class="icon-btn-edit">Edit</button>
          <button class="icon-btn-del">Hapus</button>
        </div>`;
      row.querySelector(".icon-btn-edit").addEventListener("click", ()=>editMenu(item.id));
      row.querySelector(".icon-btn-del").addEventListener("click", ()=>deleteMenu(item.id));
      wrap.appendChild(row);
    });
  }

  function editMenu(id){
    const item = menu.find(m=>m.id===id);
    if(!item) return;
    document.getElementById("menuId").value = item.id;
    document.getElementById("menuNama").value = item.name;
    document.getElementById("menuHarga").value = item.price;
    document.getElementById("menuKategori").value = item.category;
    document.getElementById("menuGambar").value = item.image || "";
    document.getElementById("formMenuTitle").textContent = "✏️ Edit Menu";
    document.getElementById("btnSubmitMenu").textContent = "Update Menu";
    btnBatalEdit.style.display = "block";
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function resetForm(){
    formMenu.reset();
    document.getElementById("menuId").value = "";
    document.getElementById("formMenuTitle").textContent = "➕ Tambah Menu Baru";
    document.getElementById("btnSubmitMenu").textContent = "Simpan Menu";
    btnBatalEdit.style.display = "none";
  }
  btnBatalEdit.addEventListener("click", resetForm);

  function deleteMenu(id){
    const item = menu.find(m=>m.id===id);
    if(!item) return;
    if(confirm(`Hapus menu "${item.name}"?`)){
      menu = menu.filter(m=>m.id!==id);
      saveMenu();
      renderMenuList();
      renderMenuPanel();
      toast("Menu dihapus");
    }
  }

  formMenu.addEventListener("submit", e=>{
    e.preventDefault();
    const id = document.getElementById("menuId").value;
    const nama = document.getElementById("menuNama").value.trim();
    const harga = parseFloat(document.getElementById("menuHarga").value);
    const kategori = document.getElementById("menuKategori").value;
    const gambar = document.getElementById("menuGambar").value.trim();

    if(!nama || isNaN(harga) || harga < 0){
      toast("Mohon lengkapi nama & harga dengan benar");
      return;
    }

    if(id){
      const item = menu.find(m=>m.id===id);
      if(item){
        item.name = nama; item.price = harga; item.category = kategori; item.image = gambar;
      }
      toast("Menu berhasil diperbarui");
    }else{
      menu.push({id:uid(), name:nama, price:harga, category:kategori, image:gambar});
      toast("Menu baru ditambahkan");
    }
    saveMenu();
    resetForm();
    renderMenuList();
    renderMenuPanel();
  });

  /* ================= INIT ================= */
  renderMenuPanel();
  renderCart();
  renderRekap();
  renderMenuList();

})();
</script>
</body>
</html>
